<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hayashi Design Works — Ink</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#0a0a0b;
    /* pan-y: 縦スワイプはページスクロールに渡す。横/タップは作品が拾う */
    -webkit-user-select:none; user-select:none; }
  html, body, canvas { touch-action:pan-y; }
  canvas { display:block; }
</style>
</head>
<body>
<script>
/* =========================================================
   Hayashi Design Works — INK (新規制作 / 別物 v1)
   ---------------------------------------------------------
   コンセプト: 指でなぞると水中にインクが広がる
   ・タッチ主役（マルチタッチ）。端末センサーは不使用 = Wix iframeでも動く
   ・モノトーン + 差し色（速い/新しいインクの芯だけ色が灯る）
   ・軽量: ソフトスプライト + ノイズ流れ場 + ゆっくり拡散で「滲み」を再現
   ・無操作でも環境インクが漂う
   ========================================================= */

/* ===== CONFIG（ここだけ触れば調整できる） ===== */
const CONFIG = {
  bg:        [10, 10, 12],     // 背景（ほぼ黒）
  ink:       [235, 238, 245],  // 落ち着いたインク色（オフホワイト）
  accent:    [40, 110, 255],   // 差し色（青）。例: 朱[255,72,48] / 緑[40,210,150]
  fade:      0.045,            // 1フレームの消え具合（大きいほど早く消える）
  maxParts:  900,             // パーティクル上限（端末に応じて自動調整）
  flowScale: 0.0016,          // 流れ場の細かさ
  flowSpeed: 0.18,            // 流れ場の動く速さ
  flowForce: 0.16,            // 水流に押される強さ
  damping:   0.94,            // インクの粘り（小さいほどすぐ止まる）
  lifeDecay: 0.006,           // 寿命の減り
};

/* ===== state ===== */
let parts = [];
let blob;                    // ソフトな円スプライト
let t = 0;
let lastTouchInfo = {};      // タッチid -> 直前位置
let everTouched = false;
let lastTapTime = 0;
let ambientTimer = 0;
let DPR = 1;

/* ===== setup ===== */
function setup(){
  // 軽量化: スマホは等倍、PCも控えめ（塗り面積=DPR^2 が効くので効果大）
  const small = min(windowWidth, windowHeight) < 700;
  DPR = small ? 1 : Math.min(window.devicePixelRatio || 1, 1.5);
  pixelDensity(DPR);
  createCanvas(windowWidth, windowHeight);
  if (small) CONFIG.maxParts = 380;
  makeBlob();
  paintBg(255);
  frameRate(60);
}

function windowResized(){
  resizeCanvas(windowWidth, windowHeight);
  paintBg(255);
}

/* 背景を塗る（aは0-255） */
function paintBg(a){
  noStroke();
  fill(CONFIG.bg[0], CONFIG.bg[1], CONFIG.bg[2], a);
  rect(0, 0, width, height);
}

/* ソフトな放射状グラデのスプライトを1枚だけ作る（毎回shadowBlurより遥かに軽い） */
function makeBlob(){
  const S = 128;
  blob = createGraphics(S, S);
  blob.noStroke();
  const c = S / 2;
  const ctx = blob.drawingContext;
  const g = ctx.createRadialGradient(c, c, 0, c, c, c);
  g.addColorStop(0.0, 'rgba(255,255,255,1.0)');
  g.addColorStop(0.25,'rgba(255,255,255,0.55)');
  g.addColorStop(1.0, 'rgba(255,255,255,0.0)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, S, S);
}

/* ===== draw ===== */
function draw(){
  // 古いインクをゆっくり沈める（滲んで消える）
  paintBg(CONFIG.fade * 255);

  // 環境インク（無操作でも漂う）
  ambient();

  // パーティクル更新・描画
  push();
  blendMode(ADD);  // 暗い背景の上で光を足し込む = インクが滲んで光る
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    updateParticle(p);
    drawParticle(p);
    if (p.life <= 0) parts.splice(i, 1);
  }
  pop();

  drawHint();
  t += CONFIG.flowSpeed * 0.01;
}

/* ===== particle ===== */
function spawn(x, y, vx, vy, burst){
  for (let i = 0; i < burst; i++){
    if (parts.length >= CONFIG.maxParts) parts.shift(); // 古いものから捨てる
    const spread = 6;
    const jitter = 0.45;
    parts.push({
      x: x + random(-spread, spread),
      y: y + random(-spread, spread),
      vx: vx * 0.18 + random(-jitter, jitter),
      vy: vy * 0.18 + random(-jitter, jitter),
      size: random(26, 64),
      life: 1.0,
      decay: CONFIG.lifeDecay * random(0.7, 1.4),
      // 勢いがあるほど差し色を多めに灯す
      accent: constrain(mag(vx, vy) * 0.05, 0, 1),
    });
  }
}

function updateParticle(p){
  // 流れ場（水流）に押される
  const a = noise(p.x * CONFIG.flowScale, p.y * CONFIG.flowScale, t) * TWO_PI * 2;
  p.vx += cos(a) * CONFIG.flowForce;
  p.vy += sin(a) * CONFIG.flowForce;
  p.vx *= CONFIG.damping;
  p.vy *= CONFIG.damping;
  p.x += p.vx;
  p.y += p.vy;
  p.life -= p.decay;
  p.accent *= 0.97;          // 差し色は時間とともに白へ落ち着く
}

function drawParticle(p){
  if (p.life <= 0) return;
  const age = 1 - p.life;
  // 老化で広がる（インクが滲む）
  const s = p.size * (1 + age * 1.8);
  // 色: 差し色 → インク色 へ補間
  const r = lerp(CONFIG.ink[0], CONFIG.accent[0], p.accent);
  const g = lerp(CONFIG.ink[1], CONFIG.accent[1], p.accent);
  const b = lerp(CONFIG.ink[2], CONFIG.accent[2], p.accent);
  // 加算合成なので各粒は薄く。寿命で消えていく
  const alpha = p.life * 42;
  push();
  tint(r, g, b, alpha);
  imageMode(CENTER);
  image(blob, p.x, p.y, s, s);
  pop();
}

/* ===== 環境インク: たまに端から漂わせる ===== */
function ambient(){
  ambientTimer--;
  if (ambientTimer > 0) return;
  ambientTimer = floor(random(6, 16));
  // 画面のどこかに弱い種をまく（操作後は控えめ）
  const intensity = everTouched ? 0.4 : 1.0;
  if (random() < 0.7 * intensity){
    const x = random(width);
    const y = random(height);
    spawn(x, y, random(-0.6, 0.6), random(-0.6, 0.6), 1);
  }
}

/* ===== hint（最初だけ） ===== */
let hintAlpha = 0;
function drawHint(){
  const target = everTouched ? 0 : 120;
  hintAlpha = lerp(hintAlpha, target, 0.06);
  if (hintAlpha < 1) return;
  push();
  textAlign(CENTER, CENTER);
  textSize(min(width, height) * 0.035);
  textStyle(NORMAL);
  fill(CONFIG.ink[0], CONFIG.ink[1], CONFIG.ink[2], hintAlpha);
  text('touch  ·  指でなぞる', width / 2, height * 0.9);
  pop();
}

/* ===== input: touch（マルチタッチ）=====
   重要: preventDefault しない（return false しない）。
   縦スワイプは touch-action:pan-y でページスクロールに渡す。 */
function touchStarted(){
  registerTap();
  handleTouches(true);
  // return しない = ブラウザのスクロールを邪魔しない
}
function touchMoved(){
  handleTouches(false);
}
function touchEnded(){
  // 終了したタッチの記録を掃除
  const live = {};
  for (const tc of touches){ if (tc.id != null) live[tc.id] = true; }
  for (const id in lastTouchInfo){ if (!live[id]) delete lastTouchInfo[id]; }
}

function handleTouches(isStart){
  everTouched = true;
  if (touches.length === 0){
    // 一部端末はtouches空 → mouseで代用
    emitFrom('mouse', mouseX, mouseY, isStart);
    return;
  }
  for (const tc of touches){
    const id = tc.id != null ? tc.id : 'mouse';
    emitFrom(id, tc.x, tc.y, isStart);
  }
}

function emitFrom(id, x, y, isStart){
  const prev = lastTouchInfo[id];
  let vx = 0, vy = 0;
  if (prev && !isStart){ vx = x - prev.x; vy = y - prev.y; }
  lastTouchInfo[id] = { x, y };
  const speed = mag(vx, vy);
  // 速いほど多く吐く。軽量化のため控えめに
  const burst = constrain(floor(speed * 0.25) + (isStart ? 3 : 1), 1, 7);
  spawn(x, y, vx, vy, burst);
}

/* ===== input: mouse（PCプレビュー用）===== */
function mousePressed(){ everTouched = true; emitFrom('mouse', mouseX, mouseY, true); }
function mouseDragged(){ everTouched = true; emitFrom('mouse', mouseX, mouseY, false); }
function mouseReleased(){ delete lastTouchInfo['mouse']; }

/* ===== ダブルタップでクリア ===== */
function registerTap(){
  const now = millis();
  if (now - lastTapTime < 320){ paintBg(255); parts = []; }
  lastTapTime = now;
}
</script>
</body>
</html>
