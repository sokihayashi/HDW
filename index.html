const CONFIG = {
  accent: [0.20, 0.55, 1.0],   // 差し色(青)。朱:[1.0,0.30,0.20] 緑:[0.16,0.85,0.60]
  // 適応解像度の範囲（レンダ長辺px）— ロゴを綺麗に見せたいので高め
  res: {
    startMobile: 820,  startDesktop: 1280,
    maxMobile:   1280, maxDesktop:  1900,
    min:         680,
  },
  // 背景に置く文字（= ガラスが屈折させる。ロゴ/タイポとの関わり）
  bgLines: ['HAYASHI', 'DESIGN', 'WORKS'],
  bgFoot:  'Soki Hayashi Designworks',
  bgInk:   238,    // 文字色 (0-255 グレースケール)
  bgPaper: 12,     // 背景色
  // ガラスの質感
  glassTint:  0.80,  // 透け具合 (1.0=クリア)。上げてロゴが読めるように
  lens:       0.12,  // 屈折で背景がズレる量(穏やかに＝ロゴが歪みすぎない)
  dispersion: 0.012, // 色収差(分光)。縁だけ薄く＝上品に
  flipBg:     true,  // 背景テクスチャの上下反転(文字が逆さに見えたら false に)
  // 液体のサイズ（画面サイズで可変）
  formScale:  1.0,   // 全体倍率の手動調整
  // 屈折させる対象（ロゴ画像）。空ならテキスト(bgLines)で代用
  logoUrl:    LOGO_URI,   // ロゴをHTMLに焼き込み（外部ファイル不要・どこでも動く）
  logoSize:   0.42,          // 画面短辺に対するロゴの大きさ
  logoTiltMax: 0.55,         // スクロール連動の3D回転(Y軸)の最大角(rad)
};

let myShader, cnv, bgTex, logoImg;
let rmLong = 700, rmMaxDev = 980;     // 現在/上限のレンダ長辺
let fpsAvg = 60, adjustCool = 0;
let fine = 0;                         // 「細かさ」: 連打で増え、ゆっくり戻る
let lastTap = -9999;                  // 直前タップ時刻（連打テンポの計測用）
let scrollProg = 0.5, scrollTarget = 0.5, lastScrollMsg = -9999; // スクロール連動(postMessage)

let currentAudioLevel = 0.0, targetAudioLevel = 0.0; // 「興奮度」(飛散の強さ)
let rotationX = 0, rotationY = 0, targetRotationX = 0, targetRotationY = 0;
let mx = 0, my = 0, tmx = 0, tmy = 0;                 // 生命体が向かう先(-1..1)
let vmx = 0, vmy = 0;                                 // 速度(液体の慣性/揺り戻し)
let pullX = 0, pullY = 0, tpullX = 0, tpullY = 0;     // 指で引いている向き
let lastInteract = -99999;

let numDrops = 22;
let currentDirs = [], targetDirs = [], masses = [];

/* ===== sizing: 低解像度バッファで描いてCSSで全画面に拡大 ===== */
function deviceCaps(){
  const mob = min(windowWidth, windowHeight) < 700;
  const start = mob ? CONFIG.res.startMobile : CONFIG.res.startDesktop;
  let mx2  = mob ? CONFIG.res.maxMobile   : CONFIG.res.maxDesktop;
  mx2 = min(mx2, max(windowWidth, windowHeight)); // 表示画素を超えて描かない
  return { start, max: mx2 };
}
function renderSize(){
  const a = windowWidth / windowHeight;
  let w, h;
  if (windowWidth >= windowHeight){ w = rmLong; h = Math.round(rmLong / a); }
  else                            { h = rmLong; w = Math.round(rmLong * a); }
  return { w: max(2, w), h: max(2, h) };
}
function applyDisplaySize(){
  cnv.style('width',  windowWidth  + 'px');
  cnv.style('height', windowHeight + 'px');
}
function reflow(){
  const r = renderSize();
  resizeCanvas(r.w, r.h);
  applyDisplaySize();
  buildBgTex();
}

/* 背景テクスチャ(=ロゴ/タイポ)を生成。ガラスがこれを屈折させる */
function buildBgTex(){
  if (bgTex) bgTex.remove();
  // 液体のレンダ解像度ではなく「表示解像度」でロゴを描く（引きずられて低解像度化しない）
  const longD = min(max(windowWidth, windowHeight), 2048);
  const a = width / height;
  let bw, bh;
  if (windowWidth >= windowHeight){ bw = longD; bh = round(longD / a); }
  else                            { bh = longD; bw = round(longD * a); }
  const g = createGraphics(max(2, bw), max(2, bh));
  g.pixelDensity(1);
  g.background(CONFIG.bgPaper);
  g.noStroke();
  if (logoImg){
    // ロゴ画像を中央に（液体がこれを屈折させる）
    const s = min(g.width, g.height) * CONFIG.logoSize;
    const r = logoImg.width / logoImg.height;
    let w2 = s, h2 = s / r;
    if (r < 1){ h2 = s; w2 = s * r; }
    g.imageMode(CENTER);
    g.image(logoImg, g.width / 2, g.height / 2, w2, h2);
  } else {
    // フォールバック: テキストを描く
    g.fill(CONFIG.bgInk);
    g.textFont('Helvetica');
    g.textStyle(BOLD);
    g.textAlign(LEFT, TOP);
    const mgn = g.width * 0.06;
    const size = g.height * 0.155;
    g.textSize(size);
    let y = g.height * 0.07;
    for (let i = 0; i < CONFIG.bgLines.length; i++){
      g.text(CONFIG.bgLines[i], mgn, y);
      y += size * 0.92;
    }
    g.textStyle(NORMAL);
    g.textSize(max(10, g.height * 0.016));
    g.text(CONFIG.bgFoot, mgn, g.height * 0.95);
  }
  bgTex = g;
}

function preload(){
  if (CONFIG.logoUrl){
    logoImg = loadImage(CONFIG.logoUrl, () => {}, () => { logoImg = null; });
  }
}

/* 液体の倍率: 画面が大きいほど少し大きく */
function formScaleFactor(){
  const s = constrain(map(min(windowWidth, windowHeight), 380, 1200, 0.9, 1.45), 0.9, 1.6);
  return s * CONFIG.formScale;
}

function setup(){
  pixelDensity(1);
  const c = deviceCaps();
  rmMaxDev = c.max;
  rmLong = min(c.start, rmMaxDev);
  const r = renderSize();
  cnv = createCanvas(r.w, r.h, WEBGL);
  applyDisplaySize();
  myShader = createShader(vs, fs);
  noStroke();
  buildBgTex();
  // Wix(親ページ)からスクロール位置を受け取りロゴを3D回転（無ければ自動回転）
  window.addEventListener('message', (e) => {
    const d = e.data;
    if (d && typeof d.hdwScroll === 'number'){
      scrollTarget = constrain(d.hdwScroll, 0, 1);
      lastScrollMsg = millis();
    }
  });
  for (let i = 0; i < numDrops; i++){
    const v = p5.Vector.random3D().mult(1.0);
    currentDirs.push(v.x, v.y, v.z);
    targetDirs.push(v.x, v.y, v.z);
    masses.push(random(0.5, 2.0));
  }
}
function windowResized(){
  const c = deviceCaps();
  rmMaxDev = c.max;
  rmLong = constrain(rmLong, CONFIG.res.min, rmMaxDev);
  reflow();
}

/* ===== 適応解像度: FPSに応じてレンダ解像度を上下 ===== */
function adaptResolution(){
  fpsAvg = lerp(fpsAvg, frameRate(), 0.08);
  if (adjustCool > 0){ adjustCool--; return; }
  if (frameCount < 45) return;
  if (fpsAvg < 45 && rmLong > CONFIG.res.min){
    rmLong = max(CONFIG.res.min, floor(rmLong * 0.85));
    reflow(); adjustCool = 45;
  } else if (fpsAvg > 56 && rmLong < rmMaxDev){
    rmLong = min(rmMaxDev, floor(rmLong * 1.08));
    reflow(); adjustCool = 70;
  }
}

/* ===== draw ===== */
function draw(){
  if (!myShader) return;
  shader(myShader);

  const now = millis();
  const idle = (now - lastInteract) > 2200;
  if (idle){
    // 無操作時: ゆったり荘厳に自転・呼吸し、たまに大きく伸び上がる
    targetRotationY += 0.0014;
    const breath = 0.50 + 0.32 * sin(now * 0.0011);
    if (targetAudioLevel < breath) targetAudioLevel = breath;
    tmx = sin(now * 0.00028) * 0.34;
    tmy = cos(now * 0.00037) * 0.30;
    if (frameCount % 220 === 0) pulse(1.7, 1.6, 2.8);
  }

  // なめらかな追従（粘性のある動き）
  rotationX += (targetRotationX - rotationX) * 0.08;
  rotationY += (targetRotationY - rotationY) * 0.08;
  // バネ＋減衰で「行き過ぎて揺り戻す」液体の慣性に（フリックすると body がスロッシュ）
  vmx += (tmx - mx) * 0.022; vmx *= 0.86; mx += vmx;
  vmy += (tmy - my) * 0.022; vmy *= 0.86; my += vmy;
  // 指の引き（尾）— なぞっている間だけ立ち上がり、離すと戻る
  pullX += (tpullX - pullX) * 0.25; tpullX *= 0.82;
  pullY += (tpullY - pullY) * 0.25; tpullY *= 0.82;
  for (let i = 0; i < currentDirs.length; i++){
    currentDirs[i] += (targetDirs[i] - currentDirs[i]) * 0.05;
  }
  targetAudioLevel *= 0.95;
  currentAudioLevel += (targetAudioLevel - currentAudioLevel) * 0.08;
  fine *= 0.990;   // 細かさはゆっくり戻る（連打で蓄積→徐々に再合体）

  // ロゴの3D回転: スクロール信号があれば連動、無ければゆっくり自動回転
  scrollProg += (scrollTarget - scrollProg) * 0.08;
  let logoRot;
  if (millis() - lastScrollMsg < 2500){
    logoRot = (scrollProg - 0.5) * 2.0 * CONFIG.logoTiltMax;
  } else {
    logoRot = sin(millis() * 0.0004) * CONFIG.logoTiltMax * 0.5;
  }

  myShader.setUniform('u_resolution', [float(width), float(height)]);
  myShader.setUniform('u_time', now / 1000.0);
  myShader.setUniform('u_mouse', [mx, my]);
  myShader.setUniform('u_audioLevel', currentAudioLevel);
  myShader.setUniform('u_rotation', [rotationX, rotationY]);
  myShader.setUniform('u_directions', currentDirs);
  myShader.setUniform('u_masses', masses);
  myShader.setUniform('u_accent', CONFIG.accent);
  myShader.setUniform('u_pull', [pullX, pullY]);
  myShader.setUniform('u_fine', fine);
  myShader.setUniform('u_bg', bgTex);
  myShader.setUniform('u_glassTint', CONFIG.glassTint);
  myShader.setUniform('u_lens', CONFIG.lens);
  myShader.setUniform('u_disp', CONFIG.dispersion);
  myShader.setUniform('u_flip', CONFIG.flipBg ? 1.0 : 0.0);
  myShader.setUniform('u_scale', formScaleFactor());
  myShader.setUniform('u_logoRot', logoRot);

  beginShape();
  vertex(-1, -1, 0, 0, 0);
  vertex( 1, -1, 0, 1, 0);
  vertex( 1,  1, 0, 1, 1);
  vertex(-1,  1, 0, 0, 1);
  endShape(CLOSE);

  adaptResolution();
}

/* ===== 飛散パルス ===== */
function pulse(audio, lo, hi){
  targetAudioLevel = audio;
  for (let i = 0; i < numDrops; i++){
    const m = masses[i];
    const v = p5.Vector.random3D().mult(random(lo, hi) / m);
    targetDirs[i * 3 + 0] = v.x;
    targetDirs[i * 3 + 1] = v.y;
    targetDirs[i * 3 + 2] = v.z;
  }
}

/* ===== interaction（スクロールは殺さない = preventDefaultしない） ===== */
function poke(px, py){
  tmx = map(px, 0, width, -1.0, 1.0);
  tmy = map(py, 0, height, 1.0, -1.0);
  // タップの「強さ」は取れないので、連打の「速さ(間隔)」でバラけ方を決める
  const now = millis();
  const dt = now - lastTap;
  lastTap = now;
  const rapid = constrain(map(dt, 80, 520, 1.0, 0.12), 0.12, 1.0); // 速い連打ほど1.0
  fine = min(1.0, fine + 0.08 + rapid * 0.34);                     // 速いほど一気に細かく
  pulse(2.0 + rapid * 3.5, 0.8, 1.4 + rapid * 1.8);                // 速いほど激しく弾ける
  lastInteract = now;
}
function dragRotate(){
  const dx = mouseX - pmouseX, dy = mouseY - pmouseY;
  const sp = mag(dx, dy);
  // body は指へ寄り（バネで遅れて追う）、引いた向きへ尾を引き、速いと表面が波立つ
  tmx = map(mouseX, 0, width, -1.0, 1.0);
  tmy = map(mouseY, 0, height, 1.0, -1.0);
  if (sp > 3){
    tpullX = constrain(dx *  0.020, -1.0, 1.0);
    tpullY = constrain(dy * -0.020, -1.0, 1.0);
    targetAudioLevel = max(targetAudioLevel, min(sp * 0.045, 2.4));
  }
  if (abs(dx) >= abs(dy)){            // 横移動が主のときだけ回転（縦=スクロール優先）
    targetRotationY += dx * 0.01;
    targetRotationX += dy * 0.01;
  }
  lastInteract = millis();
}

function touchStarted(){ poke(mouseX, mouseY); }     // returnしない
function touchMoved(){ dragRotate(); }
function mousePressed(){ poke(mouseX, mouseY); }
function mouseDragged(){ dragRotate(); }

/* ===== shaders ===== */
const vs = `
  attribute vec3 aPosition;
  void main(){ gl_Position = vec4(aPosition, 1.0); }
`;

const fs = `
  precision highp float;
  uniform float u_time;
  uniform vec2  u_resolution;
  uniform vec2  u_mouse;
  uniform float u_audioLevel;
  uniform vec2  u_rotation;
  uniform vec3  u_directions[22];
  uniform float u_masses[22];
  uniform vec3  u_accent;
  uniform vec2  u_pull;       // 指で引いている向き(尾を引く/body を引っ張る)
  uniform float u_fine;       // 細かさ(連打で増える)
  uniform sampler2D u_bg;     // 背景テクスチャ(ロゴ/タイポ)
  uniform float u_glassTint;  // ガラスの透け具合
  uniform float u_lens;       // 屈折の強さ
  uniform float u_disp;       // 色収差の強さ
  uniform float u_flip;       // 背景テクスチャ上下反転
  uniform float u_scale;      // 液体の倍率(画面サイズ可変)
  uniform float u_logoRot;    // ロゴ平面のY軸回転(スクロール連動)

  float noise(vec2 p){ return fract(sin(dot(p, vec2(12.9898, 78.233))) * 43758.5453); }

  vec3 rotate(vec3 p, vec2 r){
    float s = sin(r.x), c = cos(r.x);
    p.yz *= mat2(c, -s, s, c);
    s = sin(r.y); c = cos(r.y);
    p.xz *= mat2(c, s, -s, c);
    return p;
  }

  float smin(float a, float b, float k){
    float h = clamp(0.5 + 0.5 * (b - a) / k, 0.0, 1.0);
    return mix(b, a, h) - k * h * (1.0 - h);
  }

  float mapScene(vec3 p){
    p = rotate(p, u_rotation);

    float wobble = sin(p.x * 2.0 + u_time * 2.0) * cos(p.y * 2.0 + u_time * 1.5);
    p += wobble * (u_audioLevel * 0.1);

    vec3 mousePos = vec3(u_mouse * 0.6, 0.0);
    float d = 1e10;
    // 細かさ/興奮で融合を弱める → 連打でバラけて極小の飛沫へ
    float blendK = mix(0.38, 0.03, clamp(u_audioLevel * 0.18 + u_fine * 1.0, 0.0, 1.0));
    vec3 prevPos = u_directions[21];

    for (int i = 0; i < 22; i++){
      vec3 currentDir = u_directions[i];
      float m = u_masses[i];

      vec3 targetPos = mix(currentDir, prevPos, 0.2);
      // 細かいほど外へ広がって飛び散る
      vec3 parentPos = mousePos + targetPos * (u_audioLevel * 0.22 + 0.2 + u_fine * 0.6);
      parentPos.xy -= u_pull * (0.10 + 0.50 * (float(i) / 21.0));

      float t = u_time * (2.0 + m) + float(i) * 1.5;
      parentPos += vec3(sin(t), cos(t * 0.8), sin(t * 1.2)) * 0.13;

      float bounce = sin(u_time * 5.0 + float(i)) * 0.028 * (u_audioLevel + 0.5);
      float pSize = (0.10 + (m * 0.045) + bounce) * (1.0 - 0.75 * u_fine); // 細かいほど極小に

      float ripple = sin(length(p - parentPos) * 18.0 - u_time * 9.0) * 0.02 * u_audioLevel;
      float drop = length(p - parentPos) - (pSize + ripple);

      d = smin(d, drop, blendK);
      prevPos = currentDir;
    }
    // 細かさ: 高周波で表面を砕いて霧化（数え切れない飛沫へ）
    d += (sin(p.x * 33.0) * sin(p.y * 31.0) * sin(p.z * 35.0)) * 0.011 * u_fine;
    return d;
  }

  vec3 getNormal(vec3 p){
    vec2 e = vec2(0.01, 0.0);
    return normalize(vec3(
      mapScene(p + e.xyy) - mapScene(p - e.xyy),
      mapScene(p + e.yxy) - mapScene(p - e.yxy),
      mapScene(p + e.yyx) - mapScene(p - e.yyx)
    ));
  }

  // 擬似環境(スタジオ): ほぼ暗く、明るいソフトボックスの帯だけが鋭く映り込む = 締まったクローム
  vec3 env(vec3 r){
    float y = r.y * 0.5 + 0.5;
    float top = smoothstep(0.58, 0.70, y) * (1.0 - smoothstep(0.88, 1.0, y));
    float low = smoothstep(0.14, 0.22, y) * (1.0 - smoothstep(0.30, 0.42, y));
    vec3 c = vec3(0.025);
    c += vec3(1.25) * top;    // 上のソフトボックス(控えめ)
    c += vec3(0.35) * low;    // 下の弱い帯
    return c;
  }

  // ロゴ平面のY軸3D回転（スクロール連動）: 透視投影の逆写像
  vec2 logoUV(vec2 uv){
    vec2 s = uv - 0.5;
    float ca = cos(u_logoRot), sa = sin(u_logoRot);
    float D = 2.2;
    float X = s.x * D / (D * ca + s.x * sa);
    float depth = D - X * sa;
    float Y = s.y * depth / D;
    return vec2(X, Y) + 0.5;
  }

  // 背景テクスチャ(ロゴ)を screen uv で参照。3D回転を適用し、p5の上下反転は u_flip で補正
  vec3 bgAt(vec2 uv){
    uv = logoUV(uv);
    if (u_flip > 0.5) uv.y = 1.0 - uv.y;
    if (uv.x < 0.0 || uv.x > 1.0 || uv.y < 0.0 || uv.y > 1.0) return vec3(0.047); // 枠外=背景色
    return texture2D(u_bg, uv).rgb;
  }

  void main(){
    vec2 uv  = (gl_FragCoord.xy * 2.0 - u_resolution.xy) / min(u_resolution.x, u_resolution.y);
    vec2 suv = gl_FragCoord.xy / u_resolution.xy;   // 0..1 スクリーン座標

    vec3 ro = vec3(0.0, 0.0, 4.6);
    vec3 rd = normalize(vec3(uv / u_scale, -2.2));  // u_scaleで液体を拡縮(背景は不変)

    vec3 bg  = bgAt(suv);   // 背後のロゴ/タイポ（くっきり）
    vec3 col = bg;

    float nearest = 1e9;
    bool hit = false;
    float t = 0.0;
    for (int i = 0; i < 84; i++){
      vec3 p = ro + rd * t;
      float d = mapScene(p);
      nearest = min(nearest, d);
      if (d < 0.0012){
        hit = true;
        vec3 n  = getNormal(p);
        vec3 vd = -rd;

        vec3 hlf  = normalize(normalize(vec3(0.5, 0.9, 0.8)) + vd);
        float spec = pow(max(dot(n, hlf), 0.0), 90.0);      // 1点の上品なハイライト
        float fres = pow(1.0 - max(dot(n, vd), 0.0), 4.0);  // 縁を引き締める

        // 屈折: 背後のロゴがレンズ越しに「読める程度」に歪む。色収差は縁だけ薄く
        vec3 rdir = refract(rd, n, 0.72);
        vec2 base = suv + rdir.xy * u_lens;
        float dsp = u_disp * fres;       // 分光は縁(fres)のみ＝上品
        vec3 refr = vec3(
          bgAt(base + vec2(dsp, 0.0)).r,
          bgAt(base).g,
          bgAt(base - vec2(dsp, 0.0)).b
        );
        refr *= u_glassTint;

        // 反射: 控えめな映り込み（分光なし）
        vec3 envCol = env(reflect(rd, n));

        vec3 glass = mix(refr, envCol, fres * 0.65);             // 縁にだけ上品な反射
        glass += spec * 1.4;                                     // ハイライト
        glass += fres * (vec3(0.10) + u_accent * 0.08);          // 縁はほぼ白＋ごく僅かな差し色

        float fog = clamp(exp(-0.16 * (t - 3.0)), 0.0, 1.0);
        col = mix(bg, glass, fog);
        break;
      }
      t += d;
      if (t > 11.0) break;
    }

    // 疑似ブルーム: シルエットへごく控えめに滲む光
    if (!hit){
      float glow = exp(-nearest * 9.0);
      col += (vec3(0.20) + u_accent * 0.40) * glow * (0.10 + u_audioLevel * 0.5);
    }

    // 階調: S字コントラスト + ビネット + グレイン
    col = clamp(col, 0.0, 1.0);
    col = mix(col, smoothstep(0.0, 1.0, col), 0.45);
    col *= 1.05 - length(uv) * 0.18;
    col += (noise(uv * 500.0 + u_time) - 0.5) * 0.025;
    gl_FragColor = vec4(col, 1.0);
  }
`;
</script>
