<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<title>p5.js – Stable Normal Mode</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#0b0b0b; }
</style>
</head>
<body>
<script>
/* ===== sizing (desktop/tablet) ===== */
function UISCALE(){ const s=min(windowWidth,windowHeight); return constrain(s/1200,0.6,1.0); }
function GUTTER(){ const w=windowWidth; return w>=1280?28:(w>=900?24:20); }

/* ===== state ===== */
let isPaused=false;
let hueVal=210, satVal=75;

/* ===== layout ===== */
let S=1, JOY_R=34, KNOB_R=6, HIT_PAD=10, joyPos={x:0,y:0};
let BTN_SIZE=38, playBtn={x:0,y:0};

function computeLayout(){
  S=UISCALE(); const g=GUTTER();
  JOY_R=Math.round(34*S);
  KNOB_R=Math.round(6*S);
  HIT_PAD=Math.round(10*S);
  BTN_SIZE=Math.round(38*S);
  joyPos.x=g+JOY_R; joyPos.y=g+JOY_R;
  playBtn.x=g+BTN_SIZE/2; playBtn.y=height-g-BTN_SIZE/2;
}

/* ===== p5 ===== */
function setup(){
  createCanvas(windowWidth, windowHeight);
  colorMode(HSB,360,100,100,100);
  // 最初だけ背景を塗る（以降は作品を重ね描き）
  background(184,93,11,100);
  frameRate(60);
  computeLayout();
}
function windowResized(){
  resizeCanvas(windowWidth, windowHeight);
  // リサイズ時は背景を軽くリセット
  background(184,93,11,100);
  computeLayout();
}

function draw(){
  if(!isPaused) ensui();          // 作品を描く（BLEND固定）
  drawJoystick();                 // UI（シンプルで安定）
  drawPlayStop();
}

/* ===== your visual ===== */
function ensui(){
  let center=createVector(random(width), random(height));
  let brightness=random(20,100);
  let weight=random(10,50);
  let d=random(height/2);
  stroke(0);
  strokeWeight(random(1,4));
  for(let x=0; x<height; x+=weight){
    fill(hueVal, satVal, brightness);
    circle(
      center.x + map(x,0,height,0,mouseX - width/2),
      center.y + map(x,0,height,0,mouseY - height/2),
      map(x,0,height,d,0)
    );
  }
}

/* ===== UI: compact & stable ===== */
let draggingJoy=false;

function drawJoystick(){
  const x=joyPos.x, y=joyPos.y;

  // ベース円（薄いグレー・固定）
  noFill(); stroke(0,0,100,35); strokeWeight(1.2);
  circle(x,y,JOY_R*2);

  // ノブ位置（角度＝Hue / 半径＝Sat）
  const ang=map(hueVal,0,340,0,TWO_PI)-HALF_PI;
  const rad=map(satVal,0,100,0,JOY_R);
  const kx=x+cos(ang)*rad, ky=y+sin(ang)*rad;

  // ノブ本体（軽い影のみ）
  push();
    noStroke();
    drawingContext.shadowBlur=6;
    drawingContext.shadowColor='rgba(0,0,0,0.20)';
    fill(hueVal, 90, 100, 95);
    circle(kx,ky,KNOB_R*2);
  pop();

  // ドラッグ中だけガイド線
  if(draggingJoy){
    noFill(); stroke(0,0,100,40); strokeWeight(1);
    line(x,y,kx,ky);
  }
}

function drawPlayStop(){
  const x=playBtn.x, y=playBtn.y;
  // 外枠（薄グレー）
  noFill(); stroke(0,0,100,60); strokeWeight(2);
  circle(x,y,BTN_SIZE);
  // アイコン（白固定）
  fill(0,0,100,95); noStroke();
  if(!isPaused){
    rectMode(CENTER);
    rect(x,y,BTN_SIZE*0.32,BTN_SIZE*0.32,1.5); // ■
  }else{
    beginShape();                                   // ▶
    vertex(x - BTN_SIZE*0.12, y - BTN_SIZE*0.20);
    vertex(x + BTN_SIZE*0.18, y);
    vertex(x - BTN_SIZE*0.12, y + BTN_SIZE*0.20);
    endShape(CLOSE);
  }
}

/* ===== interaction ===== */
function mousePressed(){
  if(dist(mouseX,mouseY,playBtn.x,playBtn.y)<BTN_SIZE/2){
    isPaused=!isPaused; return;
  }
  if(dist(mouseX,mouseY,joyPos.x,joyPos.y)<=JOY_R+HIT_PAD){
    draggingJoy=true; updateFromPointer(mouseX,mouseY,false);
  }
}
function mouseDragged(){ if(!draggingJoy) return; updateFromPointer(mouseX,mouseY,keyIsDown(SHIFT)); }
function mouseReleased(){ draggingJoy=false; }

function updateFromPointer(mx,my,fine){
  const sens=fine?1/3:1;
  const dx=(mx-joyPos.x)*sens, dy=(my-joyPos.y)*sens;
  let a=atan2(dy,dx)+HALF_PI; if(a<0)a+=TWO_PI;
  let r=sqrt(dx*dx+dy*dy); r=constrain(r,0,JOY_R);
  hueVal=map(a,0,TWO_PI,0,340);
  satVal=map(r,0,JOY_R,0,100);
}
</script>
</body>
</html>
